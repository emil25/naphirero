<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NapHíre.ro – Erdély és Magyarország hírei</title><meta name="description" content="Erdély és Magyarország fontos hírei egy helyen.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
<style>
:root{--ink:#17232e;--muted:#68757d;--paper:#f4f6f5;--white:#fff;--line:#d5dcde;--red:#df4b3b;--blue:#1d649b;--green:#168563;--gold:#e3a928}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Manrope,Arial,sans-serif}a{color:inherit;text-decoration:none}button,input{font:inherit}button{cursor:pointer}.portal{max-width:1500px;margin:auto;background:var(--white);min-height:100vh}.topline{display:flex;justify-content:space-between;align-items:center;background:#24333d;color:#d9e0e2;padding:8px 42px;font-size:10px;letter-spacing:.1em;text-transform:uppercase}.topline b{color:#ffd261}.mast{display:flex;align-items:center;justify-content:space-between;padding:21px 42px 17px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:11px}.sun{width:42px;height:42px;color:var(--gold);font-size:42px;line-height:42px;font-family:Georgia,serif}.brand-name{font-size:34px;letter-spacing:-.08em;font-weight:800}.brand-name span{color:var(--red)}.brand small{display:block;color:var(--muted);font-size:8px;letter-spacing:.15em;text-transform:uppercase;margin-top:3px}.search{display:flex;border-bottom:2px solid var(--ink)}.search input{width:190px;border:0;outline:0;padding:9px 4px;background:transparent;font-size:12px}.search button{border:0;background:transparent;font-size:18px}.nav{display:flex;padding:0 42px;border-bottom:4px solid var(--ink);overflow:auto}.nav button{padding:14px 18px 12px;border:0;border-bottom:4px solid transparent;margin-bottom:-4px;background:none;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}.nav button:hover,.nav button.active{color:var(--red);border-color:var(--red)}.content{padding:0 42px 70px}.ticker{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden}.ticker b{color:var(--red);font-size:10px;letter-spacing:.13em}.ticker a{border-left:1px solid var(--line);padding-left:14px;font:500 15px Newsreader,Georgia,serif}.lead-zone{display:grid;grid-template-columns:1.3fr .9fr .72fr;gap:24px;padding:25px 0 30px;border-bottom:1px solid var(--ink)}.hero-img{aspect-ratio:16/9;background:#d8dedb;overflow:hidden}.hero-img img{width:100%;height:100%;object-fit:cover}.hero-meta,.card-meta{margin-top:10px;color:var(--red);font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.hero h1{font:500 clamp(36px,4vw,60px)/.95 Newsreader,Georgia,serif;letter-spacing:-.045em;margin:10px 0}.hero p{margin:0;color:var(--muted);font-size:13px;line-height:1.45}.side{border-left:1px solid var(--line);padding-left:20px;display:grid;grid-template-columns:1fr 1fr;gap:18px}.side .card-img{aspect-ratio:4/3}.card-img{background:#e0e5e2;overflow:hidden}.card-img img{width:100%;height:100%;object-fit:cover;transition:transform .3s}.card:hover .card-img img{transform:scale(1.04)}.card h3{font:500 21px/1.03 Newsreader,Georgia,serif;margin:7px 0}.latest{border-left:1px solid var(--line);padding-left:20px}.latest h2{color:var(--blue);font-size:22px;margin:0;padding-bottom:10px;border-bottom:4px solid var(--blue)}.latest-item{display:grid;grid-template-columns:25px 1fr;gap:8px;padding:11px 0;border-bottom:1px solid var(--line)}.latest-item>b{color:var(--blue);font-size:12px}.latest-item strong{font:600 15px/1.1 Newsreader,Georgia,serif}.latest-item small{display:block;color:var(--muted);font-size:8px;margin-top:5px;text-transform:uppercase}.topic{margin-top:39px}.topic-head{display:flex;align-items:baseline;justify-content:space-between;border-bottom:4px solid var(--ink);padding-bottom:10px}.topic-head h2{margin:0;font:500 33px Newsreader,Georgia,serif}.topic-head h2 i{display:inline-block;width:10px;height:23px;background:var(--red);margin-right:10px;vertical-align:-2px}.topic-head a{color:var(--red);font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}.topic-grid{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:22px;padding-top:18px}.topic-grid .card:first-child{grid-row:span 2}.topic-grid .card:first-child h3{font-size:30px}.topic-grid .card:nth-child(n+2){border-top:3px solid var(--ink);padding-top:9px}.all{margin-top:43px}.all-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:0 22px}.all-grid .card{border-bottom:1px solid var(--line);padding:16px 0 20px}.all-grid .card h3{font-size:19px}.ad{margin-top:34px;background:#fff8e7;border:1px solid #e8d7ae;height:86px;display:grid;place-items:center;color:#967b44;font-size:10px;letter-spacing:.12em;text-transform:uppercase}.foot{background:#24333d;color:#d9e0e2;padding:25px 42px;font-size:11px}
@media(max-width:1000px){.topline,.mast{padding-left:20px;padding-right:20px}.nav{padding:0 10px}.content{padding:0 20px 50px}.lead-zone{grid-template-columns:1.25fr 1fr}.latest{grid-column:1/-1;border-left:0;border-top:1px solid var(--line);padding:17px 0 0;display:grid;grid-template-columns:repeat(2,1fr);gap:0 25px}.latest h2{grid-column:1/-1}.topic-grid{grid-template-columns:repeat(2,1fr)}.topic-grid .card:first-child{grid-row:auto}.all-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:620px){.topline{font-size:8px;padding:7px 14px}.topline span:last-child{display:none}.mast{padding:16px 14px}.sun{font-size:31px;width:32px}.brand-name{font-size:27px}.brand small{font-size:7px}.search input{width:105px}.nav button{padding:12px 13px;font-size:9px}.content{padding:0 14px 45px}.ticker{padding:9px 0}.ticker a{font-size:13px}.lead-zone{grid-template-columns:1fr;padding-top:18px}.hero h1{font-size:40px}.side{border-left:0;padding-left:0;grid-template-columns:1fr 1fr;gap:13px}.side .card h3{font-size:18px}.latest{display:block}.topic-head h2{font-size:28px}.topic-grid{grid-template-columns:1fr}.topic-grid .card:first-child h3{font-size:29px}.all-grid{grid-template-columns:1fr 1fr;gap:0 14px}.all-grid .card h3{font-size:17px}.foot{padding:20px 14px}}
</style></head><body>
<div id="app"><div class="status">Hírek betöltése…</div></div>
<script>
const SOURCES=[['Maszol','https://maszol.ro/rss','erdely'],['Krónika','https://kronika.ro/rss','erdely'],['Székelyhon','https://szekelyhon.ro/rss','erdely'],['Transtelex','https://transtelex.ro/rss','erdely'],['3Szék','https://www.3szek.ro/rss','erdely'],['Hargita Népe','https://hargitanepe.ro/feed/','erdely'],['Telex','https://telex.hu/rss','magyar'],['HVG','https://hvg.hu/rss','magyar'],['24.hu','https://24.hu/feed/','magyar'],['Index','https://index.hu/24ora/rss/','magyar'],['444','https://444.hu/feed','magyar'],['Origo','https://www.origo.hu/contentxml/rss20/origo_cikkek.xml','magyar']];const HIDDEN=new Set(['3Szék','Origo']);let news=[],active='mind';
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function img(item){const n=item.querySelector('media\\:content,content,enclosure,thumbnail,image');if(n?.getAttribute('url'))return n.getAttribute('url');const d=item.querySelector('description,summary')?.textContent||'';return (d.match(/https?:[^"' <]+\.(?:jpg|jpeg|png|webp)/i)||[])[0]||''}
function parse(xml,name,region){const d=new DOMParser().parseFromString(xml,'text/xml');return [...d.querySelectorAll('item,entry')].map(i=>({cim:i.querySelector('title')?.textContent?.trim()||'',link:i.querySelector('link')?.getAttribute('href')||i.querySelector('link')?.textContent?.trim()||'',datum:i.querySelector('pubDate,published,updated')?.textContent||'',lead:(i.querySelector('description,summary')?.textContent||'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim(),kep:img(i),forras:name,region})).filter(x=>x.cim&&x.link)}
async function load(){const sets=await Promise.all(SOURCES.filter(s=>!HIDDEN.has(s[0])).map(async s=>{try{const r=await fetch('/api/rss?url='+encodeURIComponent(s[1]));if(!r.ok)throw 0;return parse(await r.text(),s[0],s[2])}catch{return []}}));news=[...new Map(sets.flat().map(x=>[x.link,x])).values()].sort((a,b)=>new Date(b.datum)-new Date(a.datum));render()}
function ago(d){const h=Math.max(1,Math.round((Date.now()-new Date(d))/36e5));return h<24?h+' órája':Math.round(h/24)+' napja'}
function category(h){const t=(h.cim+' '+h.lead).toLowerCase();if(/sport|foci|fradi|bajnok|meccs|olimp|gól|kézilab/.test(t))return 'sport';if(/kultúr|film|zene|színház|könyv|kiállít|múzeum/.test(t))return 'kultura';if(/gazdaság|pénz|forint|árak?|cég|üzlet|bank|adó|fizetés/.test(t))return 'gazdasag';return 'egyeb'}
function words(s){return new Set((s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').match(/[a-z0-9]{4,}/g)||[])}
function related(lead,items,count){if(!lead)return [];const same=items.filter(h=>category(h)===category(lead));const pool=same.length>=count?same:items;const lw=words(lead.cim);const scored=pool.map(h=>({h,score:(h.region===lead.region?1:0)+[...lw].filter(w=>words(h.cim).has(w)).length})).sort((a,b)=>b.score-a.score);return scored.slice(0,count).map(x=>x.h)}
function card(h){return `<a class="card" href="${esc(h.link)}" target="_blank" rel="noopener"><div class="card-img">${h.kep?`<img src="${esc(h.kep)}" loading="lazy" alt="">`:''}</div><div class="card-meta">${esc(h.forras)} · ${ago(h.datum)}</div><h3>${esc(h.cim)}</h3></a>`}
function line(h,i){return `<a class="latest-item" href="${esc(h.link)}" target="_blank" rel="noopener"><b>${String(i+1).padStart(2,'0')}</b><span><strong>${esc(h.cim)}</strong><small>${esc(h.forras)} · ${ago(h.datum)}</small></span></a>`}
function topic(title,items,color,key){if(!items.length)return '';return `<section class="topic"><div class="topic-head"><h2><i style="background:${color}"></i>${title}</h2><a href="#" onclick="event.preventDefault();setActive('${key}')">Összes ${title.toLowerCase()} →</a></div><div class="topic-grid">${items.slice(0,6).map(card).join('')}</div></section>`}
function renderOld(){const view=active==='mind'?news:news.filter(h=>h.region===active);if(!view.length){document.getElementById('app').innerHTML='<div class="status">Nincs találat.</div>';return}const lead=view.find(h=>h.kep)||view[0],rest=view.filter(h=>h!==lead),erd=rest.filter(h=>h.region==='erdely'),mag=rest.filter(h=>h.region==='magyar');const egyeb=rest.filter(h=>!erd.includes(h)&&!mag.includes(h));document.getElementById('app').innerHTML=`<div class="portal"><div class="topline"><span>${new Date().toLocaleDateString('hu-HU',{weekday:'long',month:'long',day:'numeric'})}</span><b>${view.length} FRISS HÍR</b><span>NAPHÍRE.RO</span></div><header class="mast"><a class="brand" href="#" onclick="event.preventDefault();setActive('mind')"><span class="sun">☼</span><span><span class="brand-name">nap<span>Híre</span>.ro</span><small>ERDÉLY · MAGYARORSZÁG</small></span></a><label class="search"><input id="search" placeholder="Keresés" oninput="search(this.value)"><button>⌕</button></label></header><nav class="nav"><button class="${active==='mind'?'active':''}" onclick="setActive('mind')">Címlap</button><button class="${active==='erdely'?'active':''}" onclick="setActive('erdely')">Erdély</button><button class="${active==='magyar'?'active':''}" onclick="setActive('magyar')">Magyarország</button><button onclick="setActive('gazdasag')">Gazdaság</button><button onclick="setActive('sport')">Sport</button><button onclick="setActive('kultura')">Kultúra</button></nav><main class="content"><div class="ticker"><b>FRISS</b>${rest.slice(0,6).map(h=>`<a href="${esc(h.link)}" target="_blank" rel="noopener">${esc(h.cim)}</a>`).join('')}</div><section class="lead-zone"><a class="lead" href="${esc(lead.link)}" target="_blank" rel="noopener"><div class="hero-img">${lead.kep?`<img src="${esc(lead.kep)}" alt="">`:''}</div><div class="hero-meta">NAP TÉMÁJA · ${esc(lead.forras)}</div><h1>${esc(lead.cim)}</h1><p>${esc(lead.lead).slice(0,250)}</p></a><div class="side">${rest.slice(0,4).map(card).join('')}</div><aside class="latest"><h2>Legfrissebb</h2>${rest.slice(4,11).map(line).join('')}</aside></section>${topic('Erdély',erd,'#168563')}${topic('Magyarország',mag,'#df4b3b')}${topic('Kultúra',egyeb.filter(h=>h.rovat==='kultura'||/kultúr|film|zene|színház/i.test(h.cim)),'#8a4ca3')}${topic('Sport',egyeb.filter(h=>h.rovat==='sport'||/sport|foci|fradi|bajnok|meccs/i.test(h.cim)),'#2066a3')}${topic('Gazdaság',egyeb.filter(h=>h.rovat==='gazdasag'||/gazdaság|pénz|ár|forint|üzlet|cég/i.test(h.cim)),'#e3a928')}<section class="all"><div class="section-head"><h2><i style="background:#2066a3"></i>Minden hír</h2><span>${egyeb.length} további cikk</span></div><div class="all-grid">${egyeb.slice(0,32).map(card).join('')}</div></section><div class="ad">Hirdetési hely</div></main><footer class="foot">NapHíre.ro · Több forrásból, egyetlen áttekinthető címlapon.</footer></div>`}
function render(){const view=active==='mind'?news:(active==='erdely'||active==='magyar'?news.filter(h=>h.region===active):news.filter(h=>category(h)===active));if(!view.length){document.getElementById('app').innerHTML='<div class="status">Nincs találat.</div>';return}const used=new Set();const take=(arr,n)=>arr.filter(h=>!used.has(h.link)).slice(0,n);const lead=view.find(h=>h.kep)||view[0];used.add(lead.link);const rel=related(lead,view.filter(h=>h!==lead),4);rel.forEach(h=>used.add(h.link));const latest=take(view,7);latest.forEach(h=>used.add(h.link));const sections=[['Erdély',view.filter(h=>h.region==='erdely'),'#168563','erdely'],['Magyarország',view.filter(h=>h.region==='magyar'),'#df4b3b','magyar'],['Kultúra',view.filter(h=>category(h)==='kultura'),'#8a4ca3','kultura'],['Sport',view.filter(h=>category(h)==='sport'),'#2066a3','sport'],['Gazdaság',view.filter(h=>category(h)==='gazdasag'),'#e3a928','gazdasag']];const sectionHtml=sections.map(([title,pool,color,key])=>{const picked=take(pool,6);picked.forEach(h=>used.add(h.link));return topic(title,picked,color,key)}).join('');const remaining=view.filter(h=>!used.has(h.link));document.getElementById('app').innerHTML=`<div class="portal"><div class="topline"><span>${new Date().toLocaleDateString('hu-HU',{weekday:'long',month:'long',day:'numeric'})}</span><b>${view.length} FRISS HÍR</b><span>NAPHÍRE.RO</span></div><header class="mast"><a class="brand" href="#" onclick="event.preventDefault();setActive('mind')"><span class="sun" aria-hidden="true"><svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="20" cy="20" r="8" fill="currentColor"/><path d="M20 2v6M20 32v6M2 20h6M32 20h6M7.3 7.3l4.2 4.2M28.5 28.5l4.2 4.2M32.7 7.3l-4.2 4.2M11.5 28.5l-4.2 4.2" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></span><span><span class="brand-name">nap<span>Híre</span>.ro</span><small>ERDÉLY · MAGYARORSZÁG</small></span></a><label class="search"><input id="search" placeholder="Keresés" oninput="search(this.value)"><button>⌕</button></label></header><nav class="nav"><button class="${active==='mind'?'active':''}" onclick="setActive('mind')">Címlap</button><button class="${active==='erdely'?'active':''}" onclick="setActive('erdely')">Erdély</button><button class="${active==='magyar'?'active':''}" onclick="setActive('magyar')">Magyarország</button><button class="${active==='gazdasag'?'active':''}" onclick="setActive('gazdasag')">Gazdaság</button><button class="${active==='sport'?'active':''}" onclick="setActive('sport')">Sport</button><button class="${active==='kultura'?'active':''}" onclick="setActive('kultura')">Kultúra</button></nav><main class="content"><div class="ticker"><b>FRISS</b>${take(view,6).map(h=>`<a href="${esc(h.link)}" target="_blank" rel="noopener">${esc(h.cim)}</a>`).join('')}</div><section class="lead-zone"><a class="lead" href="${esc(lead.link)}" target="_blank" rel="noopener"><div class="hero-img">${lead.kep?`<img src="${esc(lead.kep)}" alt="">`:''}</div><div class="hero-meta">NAP TÉMÁJA · ${esc(lead.forras)}</div><h1>${esc(lead.cim)}</h1><p>${esc(lead.lead).slice(0,250)}</p></a><div class="side"><div style="grid-column:1/-1;color:#1d649b;font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding-bottom:8px;border-bottom:2px solid #1d649b">A témához kapcsolódó hírek</div>${rel.map(card).join('')}</div><aside class="latest"><h2>Legfrissebb</h2>${latest.map(line).join('')}</aside></section>${sectionHtml}<section class="all"><div class="section-head"><h2><i style="background:#2066a3"></i>Minden hír</h2><span>${remaining.length} további cikk</span></div><div class="all-grid">${remaining.slice(0,40).map(card).join('')}</div></section><div class="ad">Hirdetési hely</div></main><footer class="foot">NapHíre.ro · Több forrásból, egyetlen áttekinthető címlapon.</footer></div>`}
function setActive(f){active=f;render();scrollTo(0,0)}function search(q){const s=q.trim().toLowerCase();const old=active;const base=active==='mind'?news:(active==='erdely'||active==='magyar'?news.filter(h=>h.region===active):news.filter(h=>category(h)===active));if(!s){render();return}const found=base.filter(h=>(h.cim+' '+h.lead+' '+h.forras).toLowerCase().includes(s));const keep=news;news=found;active='mind';render();news=keep;active=old}load();
</script></body></html>
