<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NapHíre.ro – Reggeli hírpult</title>
<meta name="description" content="Erdély és Magyarország legfontosabb hírei egy áttekinthető reggeli hírpulton.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
<style>
:root{--ink:#17212b;--muted:#6c7881;--paper:#f5f6f4;--white:#fff;--line:#d8dddf;--red:#e24b3c;--blue:#2066a3;--green:#148566;--yellow:#efa92c}*{box-sizing:border-box}html{background:var(--paper)}body{margin:0;background:var(--paper);color:var(--ink);font-family:Manrope,Arial,sans-serif}a{color:inherit;text-decoration:none}button,input{font:inherit}button{cursor:pointer}.desk{max-width:1440px;margin:auto;background:var(--white);min-height:100vh}.top{height:34px;background:#25313a;color:#cdd6db;display:flex;align-items:center;justify-content:space-between;padding:0 38px;font-size:10px;letter-spacing:.09em;text-transform:uppercase}.top b{color:#ffd15a}.mast{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:24px 38px 20px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:12px}.brand-mark{width:42px;height:42px;border-radius:50%;background:var(--yellow);display:grid;place-items:center;font-weight:800;font-size:23px}.brand-name{font-size:31px;letter-spacing:-.08em;font-weight:800}.brand-name span{color:var(--red)}.brand small{display:block;color:var(--muted);font-size:8px;letter-spacing:.16em;text-transform:uppercase;margin-top:3px}.edition{text-align:center;font:500 12px Newsreader,Georgia,serif;color:var(--muted)}.edition strong{display:block;color:var(--ink);font:600 20px Newsreader,Georgia,serif}.search{justify-self:end;border-bottom:2px solid var(--ink);display:flex;align-items:center}.search input{width:170px;border:0;outline:0;background:transparent;padding:9px 4px;font-size:11px}.search button{border:0;background:transparent;font-size:18px}.nav{display:flex;gap:0;border-bottom:4px solid var(--ink);padding:0 38px;overflow:auto}.nav button{border:0;background:transparent;padding:14px 18px 12px;color:var(--ink);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;border-bottom:4px solid transparent;margin-bottom:-4px}.nav button:hover,.nav button.active{color:var(--red);border-color:var(--red)}.main{padding:0 38px 70px}.strip{display:flex;gap:15px;align-items:center;border-bottom:1px solid var(--line);padding:12px 0;overflow:hidden;white-space:nowrap}.strip b{color:var(--red);font-size:10px;letter-spacing:.12em}.strip a{font:500 15px Newsreader,Georgia,serif;border-left:1px solid var(--line);padding-left:15px}.board{display:grid;grid-template-columns:1.55fr 1fr 1fr;gap:24px;padding:28px 0 30px;border-bottom:1px solid var(--ink)}.lead{min-width:0}.lead-img{aspect-ratio:16/9;background:#d9ded9;overflow:hidden}.lead-img img{width:100%;height:100%;object-fit:cover}.lead-meta,.mini-meta{color:var(--red);font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-top:11px}.lead h1{font:500 clamp(34px,4vw,58px)/.98 Newsreader,Georgia,serif;letter-spacing:-.04em;margin:10px 0}.lead p{color:var(--muted);font-size:13px;line-height:1.45;margin:0;max-width:620px}.mini-col{border-left:1px solid var(--line);padding-left:20px;display:flex;flex-direction:column;gap:18px}.mini{display:grid;grid-template-columns:112px 1fr;gap:12px;border-top:3px solid var(--ink);padding-top:9px}.mini-img{aspect-ratio:4/3;background:#e0e4e2;overflow:hidden}.mini-img img{width:100%;height:100%;object-fit:cover}.mini h2{font:500 22px/1.02 Newsreader,Georgia,serif;margin:4px 0 0}.mini:hover h2,.tile:hover h3{text-decoration:underline;text-underline-offset:3px}.latest{border-left:1px solid var(--line);padding-left:20px}.latest h2{font-size:21px;margin:0;padding:0 0 11px;border-bottom:4px solid var(--blue);letter-spacing:.02em}.latest-item{display:grid;grid-template-columns:25px 1fr;gap:8px;padding:11px 0;border-bottom:1px solid var(--line)}.latest-item b{color:var(--blue);font-size:12px}.latest-item strong{font:600 16px/1.1 Newsreader,Georgia,serif}.latest-item small{display:block;color:var(--muted);font-size:8px;margin-top:5px;text-transform:uppercase}.section{padding:30px 0 6px}.section-head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:4px solid var(--ink);padding-bottom:10px}.section-head h2{font:500 32px Newsreader,Georgia,serif;margin:0}.section-head h2 i{display:inline-block;width:9px;height:22px;background:var(--red);margin-right:9px;vertical-align:-2px}.section-head a{font-size:9px;color:var(--red);font-weight:800;letter-spacing:.1em;text-transform:uppercase}.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;padding-top:18px}.tile-img{aspect-ratio:16/9;background:#e0e4e2;overflow:hidden}.tile-img img{width:100%;height:100%;object-fit:cover}.tile h3{font:500 24px/1.05 Newsreader,Georgia,serif;margin:8px 0}.tile p{font-size:11px;color:var(--muted);line-height:1.4;margin:0}.all{margin-top:35px}.all-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:0 22px}.all .tile{border-bottom:1px solid var(--line);padding:16px 0 20px}.sponsor{margin:35px 0 0;background:#fff7e6;border:1px solid #e7d6ad;padding:10px;text-align:center}.sponsor img{max-height:90px;max-width:100%;margin:auto}.foot{background:#25313a;color:#cdd6db;padding:25px 38px;font-size:11px;margin-top:40px}.status{padding:30px;text-align:center;color:var(--muted)}
@media(max-width:1000px){.mast{grid-template-columns:1fr auto;padding:20px}.edition{display:none}.top{padding:0 20px}.nav{padding:0 10px}.main{padding:0 20px 50px}.board{grid-template-columns:1.25fr 1fr}.latest{grid-column:1/-1;border-left:0;border-top:1px solid var(--line);padding:18px 0 0;display:grid;grid-template-columns:repeat(2,1fr);gap:0 25px}.latest h2{grid-column:1/-1}.all-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:620px){.top{font-size:8px;padding:0 14px}.top span:last-child{display:none}.mast{padding:16px 14px}.brand-mark{width:34px;height:34px;font-size:18px}.brand-name{font-size:25px}.brand small{font-size:7px}.search input{width:108px}.nav button{font-size:9px;padding:12px 13px}.main{padding:0 14px 40px}.strip{padding:10px 0}.strip a{font-size:13px}.board{grid-template-columns:1fr;padding-top:18px}.lead h1{font-size:39px}.mini-col{border-left:0;padding-left:0;display:grid;grid-template-columns:1fr 1fr;gap:12px}.mini{display:block;border-top:3px solid var(--ink)}.mini-img{aspect-ratio:16/10}.mini h2{font-size:18px}.latest{display:block}.latest-item{padding:10px 0}.section-head h2{font-size:28px}.tiles{grid-template-columns:1fr;gap:25px}.tile h3{font-size:25px}.all-grid{grid-template-columns:1fr 1fr;gap:0 16px}.all .tile h3{font-size:18px}.sponsor{margin-top:25px}.foot{padding:20px 14px}}
</style></head>
<body>
<div id="app"></div>
<script>
const sources=[['Maszol','https://maszol.ro/rss','erdely'],['Krónika','https://kronika.ro/rss','erdely'],['Székelyhon','https://szekelyhon.ro/rss','erdely'],['Transtelex','https://transtelex.ro/rss','erdely'],['3Szék','https://www.3szek.ro/rss','erdely'],['Hargita Népe','https://hargitanepe.ro/feed/','erdely'],['Telex','https://telex.hu/rss','magyar'],['HVG','https://hvg.hu/rss','magyar'],['24.hu','https://24.hu/feed/','magyar'],['Index','https://index.hu/24ora/rss/','magyar'],['444','https://444.hu/feed','magyar'],['Origo','https://www.origo.hu/contentxml/rss20/origo_cikkek.xml','magyar']];
const disabled=new Set(['3Szék','Origo']);let all=[];let filter='mind';
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function imageFrom(item){const m=item.querySelector('media\\:content, content, enclosure, thumbnail, image');const raw=m?.getAttribute('url')||m?.getAttribute('href')||'';if(raw)return raw;const d=item.querySelector('description,summary')?.textContent||'';return (d.match(/https?:[^"' <]+\.(?:jpg|jpeg|png|webp)/i)||[])[0]||''}
function parse(xml,name,region){const doc=new DOMParser().parseFromString(xml,'text/xml');return [...doc.querySelectorAll('item,entry')].map(item=>{const title=item.querySelector('title')?.textContent?.trim()||'';const link=item.querySelector('link')?.getAttribute('href')||item.querySelector('link')?.textContent?.trim()||'';const date=item.querySelector('pubDate,published,updated')?.textContent||'';const desc=item.querySelector('description,summary')?.textContent?.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim()||'';return {cim:title,link,datum:date,lead:desc,kep:imageFrom(item),forras:name,region};}).filter(h=>h.cim&&h.link)}
async function load(){const results=await Promise.all(sources.filter(s=>!disabled.has(s[0])).map(async s=>{try{const r=await fetch('/api/rss?url='+encodeURIComponent(s[1]));if(!r.ok)throw 0;return parse(await r.text(),s[0],s[2])}catch{return []}}));all=[...new Map(results.flat().map(h=>[h.link,h])).values()].sort((a,b)=>new Date(b.datum)-new Date(a.datum));render();}
function ago(d){const n=Math.max(1,Math.round((Date.now()-new Date(d))/3600000));return n<24?n+' órája':Math.round(n/24)+' napja'}
function card(h){return `<a class="tile" href="${esc(h.link)}" target="_blank" rel="noopener"><div class="tile-img">${h.kep?`<img src="${esc(h.kep)}" loading="lazy" alt="">`:''}</div><div class="mini-meta">${esc(h.forras)} · ${ago(h.datum)}</div><h3>${esc(h.cim)}</h3><p>${esc(h.lead).slice(0,150)}</p></a>`}
function list(h,i){return `<a class="latest-item" href="${esc(h.link)}" target="_blank" rel="noopener"><b>${String(i+1).padStart(2,'0')}</b><span><strong>${esc(h.cim)}</strong><small>${esc(h.forras)} · ${ago(h.datum)}</small></span></a>`}
function render(){const view=filter==='mind'?all:all.filter(h=>h.region===filter);if(!view.length){document.getElementById('app').innerHTML='<div class="status">A hírforrások betöltése folyamatban…</div>';return}const lead=view.find(h=>h.kep)||view[0],rest=view.filter(h=>h!==lead),erd=rest.filter(h=>h.region==='erdely'),mag=rest.filter(h=>h.region==='magyar');const section=(title,items,color)=>items.length?`<section class="section"><div class="section-head"><h2><i style="background:${color}"></i>${title}</h2><a href="#" onclick="event.preventDefault();setFilter('${title==='Erdély'?'erdely':'magyar'}')">Összes ${title.toLowerCase()} →</a></div><div class="tiles">${items.slice(0,6).map(card).join('')}</div></section>`:'';document.getElementById('app').innerHTML=`<div class="desk"><div class="top"><span>${new Date().toLocaleDateString('hu-HU',{weekday:'long',month:'long',day:'numeric'})}</span><b>${view.length} friss hír</b><span>NapHíre.ro · Reggeli kiadás</span></div><header class="mast"><a class="brand" href="#" onclick="event.preventDefault();setFilter('mind')"><span class="brand-mark">N</span><span><span class="brand-name">nap<span>Híre</span></span><small>erdély · magyarország</small></span></a><div class="edition"><strong>Reggeli hírpult</strong>egy helyen, ami ma számít</div><label class="search"><input id="q" placeholder="Keresés" oninput="search(this.value)"><button>⌕</button></label></header><nav class="nav"><button class="${filter==='mind'?'active':''}" onclick="setFilter('mind')">Címlap</button><button class="${filter==='erdely'?'active':''}" onclick="setFilter('erdely')">Erdély</button><button class="${filter==='magyar'?'active':''}" onclick="setFilter('magyar')">Magyarország</button><button onclick="setFilter('gazdasag')">Gazdaság</button><button onclick="setFilter('sport')">Sport</button><button onclick="setFilter('kultura')">Kultúra</button></nav><main class="main"><div class="strip"><b>FRISS</b>${rest.slice(0,6).map(h=>`<a href="${esc(h.link)}" target="_blank" rel="noopener">${esc(h.cim)}</a>`).join('')}</div><section class="board"><a class="lead" href="${esc(lead.link)}" target="_blank" rel="noopener"><div class="lead-img">${lead.kep?`<img src="${esc(lead.kep)}" alt="">`:''}</div><div class="lead-meta">Vezető hír · ${esc(lead.forras)}</div><h1>${esc(lead.cim)}</h1><p>${esc(lead.lead).slice(0,250)}</p></a><div class="mini-col">${rest.slice(0,4).map(card).join('')}</div><aside class="latest"><h2>Legfrissebb</h2>${rest.slice(4,11).map(list).join('')}</aside></section>${section('Erdély',erd,'#148566')}${section('Magyarország',mag,'#e24b3c')}<section class="all"><div class="section-head"><h2><i style="background:#2066a3"></i>Minden hír</h2><span>${rest.length} további cikk</span></div><div class="all-grid">${rest.slice(11,35).map(card).join('')}</div></section><div class="sponsor"><span>Hirdetési hely</span></div></main><footer class="foot">NapHíre.ro · Több forrás, egy áttekinthető reggeli címlap.</footer></div>`}
function setFilter(f){filter=f;render();window.scrollTo(0,0)}function search(q){const s=q.trim().toLowerCase();if(!s){filter='mind';render();return}const found=all.filter(h=>(h.cim+' '+h.lead+' '+h.forras).toLowerCase().includes(s));const old=all;all=found;render();all=old}load();
</script></body></html>
