<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NapHíre / Front</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#11141a;--cream:#f3f0e8;--red:#e64b32;--blue:#174ba3;--gold:#dda91f;--green:#16836c;--line:#c8c6bc;--muted:#69717e;--max:1400px}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:'Space Grotesk',Arial,sans-serif}a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}.wrap{width:min(var(--max),calc(100% - 60px));margin:auto}
.utility{height:32px;background:var(--ink);color:#fff;font:500 10px 'DM Mono',monospace;letter-spacing:.08em;text-transform:uppercase}.utility .wrap{height:100%;display:flex;align-items:center;justify-content:space-between}.utility b{color:#ffbb39;font-weight:500}.utility button{border:0;background:none;color:#fff;font:500 10px 'DM Mono',monospace;text-transform:uppercase}
.mast{border-bottom:2px solid var(--ink)}.mast .wrap{height:115px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}.logo{font:700 66px/.78 'Space Grotesk',sans-serif;letter-spacing:-.1em;text-align:center}.logo i{font-style:normal;color:var(--red)}.logo small{display:block;font:500 9px 'DM Mono',monospace;letter-spacing:.2em;text-transform:uppercase;margin-top:14px;color:var(--muted)}.mast-note{font:500 10px/1.35 'DM Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);max-width:200px}.mast-note strong{display:block;color:var(--ink);font:700 13px 'Space Grotesk',sans-serif;letter-spacing:-.02em;text-transform:none;margin-top:4px}.mast-tools{justify-self:end;display:flex;align-items:center;gap:10px}.mast-tools button{border:1px solid var(--ink);background:transparent;padding:9px 12px;font:700 10px 'Space Grotesk',sans-serif;text-transform:uppercase}.mast-tools button:hover{background:var(--ink);color:#fff}
.nav{border-bottom:1px solid var(--ink)}.nav .wrap{display:flex;align-items:center;justify-content:space-between}.nav-links{display:flex;overflow-x:auto}.nav button{border:0;border-right:1px solid var(--line);padding:14px 18px;background:transparent;font:700 11px 'Space Grotesk',sans-serif;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}.nav button:first-child{border-left:1px solid var(--line)}.nav button:hover,.nav button.active{background:var(--red);color:#fff}.nav-mark{color:var(--red);font:500 10px 'DM Mono',monospace;letter-spacing:.1em}
.ticker{border-bottom:1px solid var(--line);background:#fff}.ticker .wrap{height:42px;display:flex;align-items:center;gap:15px;overflow:hidden;white-space:nowrap}.ticker strong{font:700 10px 'DM Mono',monospace;letter-spacing:.11em;color:var(--red)}.ticker span{font:500 13px 'Newsreader',serif;overflow:hidden;text-overflow:ellipsis}
.topgrid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(270px,.75fr) minmax(230px,.55fr);gap:28px;padding:34px 0 31px;border-bottom:1px solid var(--line)}.lead-img{height:390px;background:#d8d0c3;overflow:hidden}.lead-img img,.image img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .45s}.lead:hover .lead-img img{transform:scale(1.04)}.kicker{display:block;color:var(--red);font:700 10px 'DM Mono',monospace;letter-spacing:.12em;text-transform:uppercase;margin:15px 0 7px}.lead h1{font:700 clamp(36px,4vw,67px)/.88 Newsreader,serif;letter-spacing:-.055em;margin:0 0 13px;max-width:880px}.lead p{color:var(--muted);font-size:14px;line-height:1.5;margin:0 0 13px;max-width:760px}.meta{font:500 10px 'DM Mono',monospace;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}.meta i{font-style:normal;color:var(--red);margin:0 6px}
.digest{border-top:7px solid var(--blue);background:#fff;padding:18px 19px 10px}.digest h2{font:700 20px Newsreader,serif;margin:0 0 14px}.digest small{font:500 9px 'DM Mono',monospace;color:var(--muted);text-transform:uppercase;letter-spacing:.09em;display:block;margin-bottom:10px}.digest a{display:grid;grid-template-columns:29px 1fr;gap:9px;padding:13px 0;border-bottom:1px solid var(--line)}.digest a:last-child{border-bottom:0}.digest em{font:700 13px 'DM Mono',monospace;color:var(--blue);font-style:normal}.digest strong{font:600 15px/1.12 Newsreader,serif}.digest a:hover strong{color:var(--red)}
.cross{border-top:7px solid var(--red);background:var(--ink);color:#fff;padding:18px 18px 14px}.cross h2{font:700 19px Newsreader,serif;margin:0 0 8px}.cross p{font-size:12px;line-height:1.42;color:#b8bfcb;margin:0 0 15px}.cross-row{display:grid;grid-template-columns:8px 1fr auto;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid #3b414b}.cross-row i{width:8px;height:8px;background:var(--red)}.cross-row:nth-child(3n) i{background:var(--gold)}.cross-row b{font-size:12px}.cross-row em{font:500 10px 'DM Mono',monospace;color:#aeb6c4;font-style:normal}
.topic{margin-top:28px;background:var(--red);color:#fff;padding:0 27px 25px}.topic-head{height:53px;display:flex;align-items:center;gap:13px;border-bottom:1px solid #ffffff55;font:700 11px 'DM Mono',monospace;letter-spacing:.12em;text-transform:uppercase}.topic-head span{margin-left:auto;color:var(--ink)}.topic-body{display:grid;grid-template-columns:1.1fr 1fr;gap:32px;padding-top:18px}.topic-main h2{font:700 34px/.94 Newsreader,serif;letter-spacing:-.045em;margin:0 0 10px}.topic-main p{font-size:13px;line-height:1.48;color:#fff1ea;margin:0 0 12px}.topic-side{display:grid;grid-template-columns:1fr 1fr;gap:0 20px}.topic-side a{border-left:2px solid var(--ink);padding:0 0 12px 11px;margin-bottom:12px}.topic-side small{display:block;color:var(--ink);font:700 9px 'DM Mono',monospace;margin-bottom:5px}.topic-side strong{font:600 15px/1.12 Newsreader,serif;display:block}
.sections{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:30px}.section{background:#fff;border-top:7px solid var(--ink);padding:0 20px 20px}.section-head{height:65px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}.section-head .num{color:var(--red);font:500 12px 'DM Mono',monospace}.section-head h2{font:700 25px 'Space Grotesk',sans-serif;letter-spacing:-.06em;text-transform:uppercase;margin:0}.section-head small{margin-left:auto;color:var(--muted);font:500 9px 'DM Mono',monospace;text-transform:uppercase}.section-body{display:grid;grid-template-columns:1.12fr 1fr;gap:19px;padding-top:17px}.section-main .image{height:175px;background:#d8d0c3;overflow:hidden;margin-bottom:9px}.section-main h3{font:700 23px/.94 Newsreader,serif;letter-spacing:-.04em;margin:3px 0 8px}.section-list a{display:block;padding:10px 0;border-bottom:1px solid var(--line);position:relative;padding-left:14px}.section-list a:before{content:'';position:absolute;left:0;top:16px;width:5px;height:5px;background:var(--red)}.section-list strong{font:600 15px/1.12 Newsreader,serif;display:block}.section-list .meta{display:block;margin-top:6px;font-size:9px}
.section.erdely{border-top-color:var(--green)}.section.erdely .section-head .num,.section.erdely .section-list a:before{color:var(--green);background:var(--green)}.section.magyar{background:var(--ink);color:#fff;border-top-color:var(--red)}.section.magyar .section-head{border-color:#3e4652}.section.magyar .section-head h2,.section.magyar .section-head small{color:#fff}.section.magyar .section-list a{border-color:#3e4652}.section.magyar .section-list strong,.section.magyar .section-main h3{color:#fff}.section.magyar .meta{color:#aab3c1}.section.gaz{background:#e6e5de;border-top-color:var(--gold)}.section.gaz .section-main{background:var(--ink);padding:15px;color:#fff}.section.gaz .section-main h3{color:#fff}.section.gaz .section-list a:before{background:var(--gold)}.section.sport{background:#dce8f7;border-top-color:var(--blue)}.section.sport .section-list a:before{background:var(--blue)}.section.kultura{background:#eee4f5;border-top-color:#8957cb}.section.kultura .section-list a:before{background:#8957cb}.section.kultura .section-main .image{filter:saturate(.75)}
footer{margin-top:45px;background:var(--ink);color:#aeb6c3;padding:33px 0}.footer{display:flex;align-items:center;justify-content:space-between}.footer b{font:700 26px 'Space Grotesk';color:#fff;letter-spacing:-.08em}.footer b i{color:var(--red);font-style:normal}.footer small{font:500 10px 'DM Mono',monospace}
@media(max-width:1000px){.topgrid{grid-template-columns:1.3fr 1fr}.cross{grid-column:1/-1}.sections{grid-template-columns:1fr}}
@media(max-width:640px){.wrap{width:calc(100% - 30px)}.mast .wrap{height:85px;display:flex}.logo{font-size:39px}.logo small{font-size:7px;margin-top:8px;letter-spacing:.13em}.mast-note{display:none}.mast-tools{margin-left:auto}.mast-tools button{font-size:9px;padding:7px}.nav .wrap{width:100%}.nav-links{width:100%}.nav button{font-size:9px;padding:12px 14px}.nav-mark{display:none}.topgrid{display:block;padding-top:20px}.lead-img{height:235px}.lead h1{font-size:39px}.digest,.cross{margin-top:20px}.topic{padding:0 16px 18px}.topic-body{grid-template-columns:1fr;gap:18px}.topic-side{grid-template-columns:1fr}.section{padding:0 14px 16px}.section-body{grid-template-columns:1fr}.section-main .image{height:190px}.section-head h2{font-size:21px}.section-head small{display:none}.footer{display:block}.footer small{display:block;margin-top:12px}}

/* Sűrű, országos híroldal-szerkezet */
.mixed-news{margin-top:30px;border-top:7px solid var(--ink);background:#fff;padding:0 20px 20px}
.mixed-head{display:flex;align-items:baseline;gap:14px;padding:16px 0 13px;border-bottom:1px solid var(--line)}
.mixed-head h2{margin:0;font:700 28px/1 'Space Grotesk',Arial,sans-serif;letter-spacing:-.06em;text-transform:uppercase}
.mixed-head span{margin-left:auto;color:var(--muted);font:500 10px 'DM Mono',monospace;text-transform:uppercase}
.mixed-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0}
.mixed-item{display:block;min-width:0;padding:16px 14px 17px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);color:var(--ink)}
.mixed-item:nth-child(4n+1){padding-left:0}
.mixed-item:nth-child(4n){padding-right:0;border-right:0}
.mixed-item:hover h3{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.mixed-img{height:112px!important;aspect-ratio:auto!important;margin-bottom:11px!important}
.mixed-item h3{margin:0;font:700 17px/1.08 Newsreader,Georgia,serif;letter-spacing:-.02em}
.mixed-item .kicker{display:block;margin-bottom:6px;font:700 9px 'DM Mono',monospace;color:var(--red);text-transform:uppercase}
.mixed-item .meta{margin-top:9px}
@media(max-width:980px){.mixed-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.mixed-item:nth-child(4n+1){padding-left:14px;border-right:1px solid var(--line)}.mixed-item:nth-child(3n+1){padding-left:0}.mixed-item:nth-child(3n){padding-right:0;border-right:0}}
@media(max-width:640px){.mixed-news{padding:0 14px 14px}.mixed-head{display:block}.mixed-head span{display:block;margin-top:7px}.mixed-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.mixed-item,.mixed-item:nth-child(3n+1),.mixed-item:nth-child(4n+1){padding:12px 10px;border-right:1px solid var(--line)}.mixed-item:nth-child(2n+1){padding-left:0;border-right:1px solid var(--line)}.mixed-item:nth-child(2n){padding-right:0;border-right:0}.mixed-item h3{font-size:16px}.mixed-img{height:84px!important}}
</style></head><body>
<div class="utility"><div class="wrap"><span><b>●</b> ÉLŐ HÍRFAL</span><span id="date"></span><button onclick="location.href='../'">Klasszikus oldal ↗</button></div></div>
<header class="mast"><div class="wrap"><div class="mast-note">Sajtófigyelés<strong>Egy helyen látod, mi fontos</strong></div><a class="logo" href="./">nap<i>híre</i><small>erdélyi és magyarországi hírek</small></a><div class="mast-tools"><button onclick="location.href='../'">Régi nézet</button></div></div></header>
<nav class="nav"><div class="wrap"><div class="nav-links"><button class="active" onclick="window.scrollTo({top:0,behavior:'smooth'})">Címlap</button><button onclick="go('erdely')">Erdély</button><button onclick="go('magyar')">Magyarország</button><button onclick="go('gaz')">Gazdaság</button><button onclick="go('sport')">Sport</button><button onclick="go('kultura')">Kultúra</button></div><span class="nav-mark">LIVE / HÍRFAL</span></div></nav>
<div class="ticker"><div class="wrap"><strong>FRISS</strong><span id="ticker">Hírek érkeznek a partnerportálokból…</span></div></div>
<main class="wrap" id="app"><div style="padding:70px 0;color:#69717e">Hírek betöltése…</div></main>
<footer><div class="wrap footer"><b>nap<i>híre</i>.ro</b><small>FRONT · szerkesztett sajtókép · minden cikk az eredeti portálon olvasható</small></div></footer>
<script>
const src=[['Maszol','erdely','https://maszol.ro/rss'],['Székelyhon','erdely','https://szekelyhon.ro/rss/szekelyhon_hirek.xml'],['Transtelex','erdely','https://transtelex.ro/rss'],['Telex','magyar','https://telex.hu/rss'],['HVG','magyar','https://hvg.hu/rss'],['24.hu','magyar','https://24.hu/feed/'],['Index','magyar','https://index.hu/24ora/rss/'],['444','magyar','https://444.hu/feed']];const app=document.getElementById('app');const esc=s=>(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function clean(s){const d=document.createElement('div');d.innerHTML=s||'';return(d.textContent||'').replace(/\s+/g,' ').trim()}function parse(x,n,r){const d=new DOMParser().parseFromString(x,'text/xml');return[...d.querySelectorAll('item,entry')].slice(0,20).map(i=>{const t=clean(i.querySelector('title')?.textContent);const l=i.querySelector('link')?.textContent?.trim()||i.querySelector('link')?.getAttribute('href')||'#';const dt=new Date(i.querySelector('pubDate,published,updated')?.textContent||Date.now());const lead=clean(i.querySelector('description,summary')?.textContent||'').slice(0,240);const en=i.querySelector('enclosure')?.getAttribute('url')||i.querySelector('media\\:content')?.getAttribute('url')||'';return t?{t,l,d:isNaN(dt)?new Date():dt,lead,img:en,n,r}:null}).filter(Boolean)}async function load(s){try{const q=await fetch('../rss?url='+encodeURIComponent(s[2]),{signal:AbortSignal.timeout(10000)});return q.ok?parse(await q.text(),s[0],s[1]):[]}catch{return[]}}function ago(d){const m=Math.floor((Date.now()-d)/60000);return m<60?m+' perce':Math.floor(m/60)+' órája'}function meta(h){return'<span class="meta">'+esc(h.n)+'<i>—</i>'+ago(h.d)+'</span>'}function photo(h,c=''){return'<div class="image '+c+'">'+(h.img?'<img src="'+esc(h.img)+'" alt="" loading="lazy">':'')+'</div>'}function mixed(items){if(!items.length)return '';const a=items.slice(0,24);return '<section class="mixed-news"><header class="mixed-head"><h2>Minden most</h2><span>'+a.length+' friss történet · egy oldalon</span></header><div class="mixed-grid">'+a.map(h=>'<a class="mixed-item" href="'+esc(h.l)+'" target="_blank" rel="noopener">'+photo(h,'mixed-img')+'<span class="kicker">'+esc(h.n)+'</span><h3>'+esc(h.t)+'</h3>'+meta(h)+'</a>').join('')+'</div></section>'}function section(id,title,items,sub){if(!items.length)return'';const a=items[0],b=items.slice(1,13);return'<section id="'+id+'" class="section '+id+'"><header class="section-head"><span class="num">0</span><h2>'+title+'</h2><small>'+sub+'</small></header><div class="section-body"><a class="section-main" href="'+esc(a.l)+'" target="_blank" rel="noopener">'+photo(a)+'<span class="kicker">'+esc(a.n)+'</span><h3>'+esc(a.t)+'</h3>'+meta(a)+'</a><div class="section-list">'+b.map(h=>'<a href="'+esc(h.l)+'" target="_blank" rel="noopener"><strong>'+esc(h.t)+'</strong>'+meta(h)+'</a>').join('')+'</div></div></section>'}function render(items){items.sort((a,b)=>b.d-a.d);const hero=items[0],focus=items.slice(0,5),cnt={};items.forEach(h=>cnt[h.n]=(cnt[h.n]||0)+1);const er=items.filter(h=>h.r==='erdely'),hu=items.filter(h=>h.r==='magyar'),gaz=items.filter(h=>/ár|pénz|gazdas|adó|cég|piac/i.test(h.t)),spo=items.filter(h=>/sport|foci|meccs|bajnok|gól|csapat/i.test(h.t)),kul=items.filter(h=>/kultúr|film|zene|színház|könyv|kiáll/i.test(h.t));app.innerHTML='<section class="topgrid"><a class="lead" href="'+esc(hero.l)+'" target="_blank" rel="noopener">'+photo(hero,'lead-img')+'<span class="kicker">'+esc(hero.n)+' · kiemelt</span><h1>'+esc(hero.t)+'</h1><p>'+esc(hero.lead)+'</p>'+meta(hero)+'</a><aside class="digest"><small>01 / röviden</small><h2>Napi fókusz</h2>'+focus.map((h,i)=>'<a href="'+esc(h.l)+'" target="_blank" rel="noopener"><em>0'+(i+1)+'</em><span><strong>'+esc(h.t)+'</strong>'+meta(h)+'</span></a>').join('')+'</aside><aside class="cross"><h2>Forráskereszt</h2><p>'+Object.keys(cnt).length+' szerkesztőség hírei egy nézetben.</p>'+Object.entries(cnt).slice(0,8).map(([n,c])=>'<div class="cross-row"><i></i><b>'+esc(n)+'</b><em>'+c+' hír</em></div>').join('')+'</aside></section><section class="topic"><div class="topic-head"><b>NAP TÉMÁJA</b><span>több forrásból</span></div><div class="topic-body"><a class="topic-main" href="'+esc(hero.l)+'" target="_blank" rel="noopener"><h2>'+esc(hero.t)+'</h2><p>'+esc(hero.lead)+'</p>'+meta(hero)+'</a><div class="topic-side">'+focus.slice(1,5).map(h=>'<a href="'+esc(h.l)+'" target="_blank" rel="noopener"><small>'+esc(h.n)+'</small><strong>'+esc(h.t)+'</strong></a>').join('')+'</div></div></section>'+mixed(items)+'<div class="sections">'+section('erdely','Erdély',er,'helyi radar')+section('magyar','Magyarország',hu,'országos ügyek')+section('gaz','Gazdaság',gaz,'piac / pénz / munka')+section('sport','Sport',spo,'eredmény / háttér')+section('kultura','Kultúra',kul,'színpad / kép / könyv')+'</div>';document.getElementById('ticker').textContent=items.slice(0,3).map(h=>h.t).join(' · ')}function go(id){document.getElementById(id)?.scrollIntoView({behavior:'smooth',block:'start'})}document.getElementById('date').textContent=new Date().toLocaleDateString('hu-HU',{year:'numeric',month:'long',day:'numeric'});Promise.all(src.map(load)).then(a=>{const x=a.flat();x.length?render(x):app.innerHTML='<div style="padding:70px 0">A hírek átmenetileg nem érhetők el.</div>'});
</script></body></html>
