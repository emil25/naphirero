<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NapHíre 360° – új híroldal</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=DM+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
:root{--ink:#12151d;--paper:#f6f4ef;--orange:#ff603f;--yellow:#f4b830;--green:#1aa36f;--blue:#2f68d7;--muted:#77808e;--line:#d7d5ce;--max:1360px}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Archivo,Arial,sans-serif}a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}
.shell{max-width:var(--max);margin:auto;padding:0 24px}.top{background:var(--ink);color:#fff;border-bottom:4px solid var(--orange)}.top .shell{height:34px;display:flex;align-items:center;justify-content:space-between;font:500 10px 'DM Mono',monospace;letter-spacing:.08em;text-transform:uppercase}.live{color:var(--yellow)}.live:before{content:'';display:inline-block;width:7px;height:7px;margin-right:7px;background:var(--orange);border-radius:50%;box-shadow:0 0 0 4px #ff603f33}.top button{border:0;background:none;color:#fff;font:500 10px 'DM Mono',monospace;text-transform:uppercase}
.mast{background:var(--paper)}.mast .shell{height:108px;display:flex;align-items:center;gap:24px}.mark{font:900 50px/.8 Archivo,sans-serif;letter-spacing:-.09em}.mark i{font-style:normal;color:var(--orange)}.mark b{font-size:.47em;color:var(--yellow);letter-spacing:-.03em}.edition{border-left:1px solid var(--line);padding-left:22px;color:var(--muted);font:600 10px/1.35 'DM Mono',monospace;letter-spacing:.06em;text-transform:uppercase}.switch{margin-left:auto;border:1px solid var(--ink);padding:9px 12px;background:transparent;color:var(--ink);font:800 10px Archivo;text-transform:uppercase}.switch:hover{background:var(--ink);color:#fff}
.nav{border-top:1px solid var(--ink);border-bottom:1px solid var(--ink)}.nav .shell{display:flex;align-items:center;justify-content:space-between;min-height:47px}.navlinks{display:flex;gap:0}.navlinks button{border:0;border-right:1px solid var(--line);background:transparent;padding:15px 18px;color:var(--ink);font:800 11px Archivo;text-transform:uppercase;letter-spacing:.07em}.navlinks button:first-child{border-left:1px solid var(--line)}.navlinks button:hover,.navlinks button.active{background:var(--orange);color:#fff}.navtag{color:var(--orange);font:900 11px 'DM Mono',monospace;letter-spacing:.11em}
main{padding:0 0 70px}.ticker{background:#fff;border-bottom:1px solid var(--line)}.ticker .shell{display:flex;align-items:center;gap:15px;min-height:40px;white-space:nowrap;overflow:hidden}.ticker strong{color:var(--orange);font:900 10px 'DM Mono',monospace;letter-spacing:.12em}.ticker span{font:600 12px Archivo;overflow:hidden;text-overflow:ellipsis}
.hero{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(280px,.7fr) minmax(230px,.5fr);gap:26px;padding:30px 0 28px;border-bottom:1px solid var(--line)}.hero-main{min-width:0}.hero-main .photo{height:385px}.photo{background:#d9d3c8;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .45s}.hero-main:hover img{transform:scale(1.04)}.hero-main h1{font:900 clamp(34px,4vw,61px)/.91 Archivo,sans-serif;letter-spacing:-.075em;margin:15px 0 12px;max-width:900px}.hero-main p{color:var(--muted);font-size:14px;line-height:1.5;margin:0 0 12px;max-width:730px}.label{color:var(--orange);font:900 10px 'DM Mono',monospace;letter-spacing:.1em;text-transform:uppercase}.meta{color:var(--muted);font:500 10px 'DM Mono',monospace;letter-spacing:.04em;text-transform:uppercase}.meta i{font-style:normal;color:var(--orange);margin:0 6px}
.focus{background:var(--ink);color:#fff;padding:20px 19px 13px;border-top:7px solid var(--yellow)}.focus h2{font:900 18px Archivo;margin:0 0 15px;letter-spacing:-.04em}.focus h2 span{color:var(--yellow);font:500 10px 'DM Mono',monospace;display:block;letter-spacing:.1em;margin-bottom:7px}.focus a{display:grid;grid-template-columns:25px 1fr;gap:9px;padding:13px 0;border-bottom:1px solid #414957}.focus a:last-child{border-bottom:0}.focus a em{font:900 12px Archivo;color:var(--yellow);font-style:normal}.focus strong{font:700 14px/1.18 Archivo;letter-spacing:-.02em}.focus a:hover strong{color:var(--yellow)}
.sources{background:#fff;border-top:7px solid var(--orange);padding:17px 17px 15px}.sources h2{font:900 18px Archivo;margin:0 0 5px}.sources p{color:var(--muted);font-size:12px;line-height:1.4;margin:0 0 14px}.source-row{display:grid;grid-template-columns:8px 1fr auto;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #e9e5dd}.source-row b{font-size:12px}.source-row em{font:500 10px 'DM Mono',monospace;color:var(--muted);font-style:normal}.source-row i{width:8px;height:8px;background:var(--orange);display:block}.source-row i:nth-child(1){background:var(--green)}.source-row i:nth-child(2){background:var(--blue)}.source-row i:nth-child(3){background:var(--yellow)}
.topic{margin-top:27px;background:var(--orange);color:#fff;padding:0 25px 23px}.topic-head{height:54px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #ffffff66}.topic-head b{font:900 12px 'DM Mono',monospace;letter-spacing:.12em}.topic-head span{font:900 13px Archivo;color:var(--ink);margin-left:auto}.topic-body{display:grid;grid-template-columns:1.2fr 1fr;gap:30px;padding-top:18px}.topic-lead h2{font:900 32px/.98 Archivo;letter-spacing:-.06em;margin:0 0 10px}.topic-lead p{font-size:13px;line-height:1.45;margin:0 0 11px;color:#fff2eb}.topic-side{display:grid;grid-template-columns:1fr 1fr;gap:0 19px}.topic-side a{border-left:2px solid var(--ink);padding:0 0 12px 11px;margin-bottom:12px}.topic-side small{display:block;color:var(--ink);font:800 9px 'DM Mono',monospace;margin-bottom:5px}.topic-side strong{display:block;font:700 14px/1.14 Archivo}
.zones{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:30px}.zone{background:#fff;border-top:7px solid var(--ink);padding:0 20px 19px}.zone-head{height:64px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}.zone-head .num{color:var(--orange);font:900 14px 'DM Mono',monospace}.zone-head h2{margin:0;font:900 24px Archivo;letter-spacing:-.06em;text-transform:uppercase}.zone-head small{margin-left:auto;color:var(--muted);font:500 9px 'DM Mono',monospace;text-transform:uppercase}.zone-body{display:grid;grid-template-columns:1fr 1fr;gap:19px;padding-top:17px}.zone-main .photo{height:170px;margin-bottom:10px}.zone-main h3{font:900 21px/1.02 Archivo;letter-spacing:-.05em;margin:3px 0 7px}.zone-list a{display:grid;grid-template-columns:7px 1fr;gap:9px;padding:9px 0;border-bottom:1px solid var(--line)}.zone-list a:before{content:'';width:5px;height:5px;background:var(--orange);margin-top:5px}.zone-list strong{font:700 14px/1.15 Archivo;display:block}.zone-list .meta{font-size:9px;display:block;margin-top:6px}
.zone-erdely{border-top-color:var(--green)}.zone-erdely .zone-head .num,.zone-erdely .zone-list a:before{color:var(--green);background:var(--green)}.zone-magyar{background:var(--ink);color:#fff;border-top-color:var(--orange)}.zone-magyar .zone-head{border-color:#444d59}.zone-magyar .zone-head h2,.zone-magyar .zone-head small{color:#fff}.zone-magyar .zone-list a{border-color:#414957}.zone-magyar .zone-list strong{color:#fff}.zone-magyar .zone-main h3{color:#fff}.zone-magyar .meta{color:#9da9b6}.zone-gaz{background:#ebe9e2;border-top-color:var(--yellow)}.zone-gaz .zone-main{background:var(--ink);color:#fff;padding:15px}.zone-gaz .zone-main h3{color:#fff}.zone-gaz .zone-list a:before{background:var(--yellow)}.zone-sport{background:#dbe8f8;border-top-color:var(--blue)}.zone-sport .zone-list a:before{background:var(--blue)}.zone-sport .zone-main h3{color:var(--ink)}.zone-kultura{background:#efe5f5;border-top-color:#8957cb}.zone-kultura .zone-list a:before{background:#8957cb}.zone-kultura .zone-main .photo{filter:saturate(.78)}
footer{background:var(--ink);color:#aeb7c2;padding:35px 0 22px;margin-top:45px}.footer-in{max-width:var(--max);margin:auto;padding:0 24px;display:flex;justify-content:space-between;gap:20px}.footer-logo{font:900 29px Archivo;color:#fff;letter-spacing:-.08em}.footer-logo i{font-style:normal;color:var(--orange)}footer small{font:500 10px 'DM Mono',monospace}
@media(max-width:1000px){.hero{grid-template-columns:1.35fr 1fr}.sources{grid-column:1/-1}.zones{grid-template-columns:1fr}}
@media(max-width:640px){.shell{padding:0 15px}.top .shell{font-size:9px}.mast .shell{height:83px;padding:0 15px}.mark{font-size:35px}.edition{display:none}.switch{font-size:9px;padding:7px}.nav .shell{padding:0}.navlinks{overflow-x:auto;width:100%}.navlinks button{padding:13px 14px;font-size:9px}.navtag{display:none}.hero{display:block;padding-top:18px}.hero-main .photo{height:230px}.hero-main h1{font-size:35px;margin-top:12px}.focus,.sources{margin-top:20px}.topic{padding:0 16px 17px}.topic-body{grid-template-columns:1fr;gap:18px}.topic-side{grid-template-columns:1fr}.zone{padding:0 14px 16px}.zone-body{grid-template-columns:1fr}.zone-main .photo{height:190px}.zone-head h2{font-size:21px}.zone-head small{display:none}.footer-in{display:block}.footer-in small{display:block;margin-top:12px}}
</style>
</head>
<body>
<div class="top"><div class="shell"><span class="live">Élő hírfal</span><span id="clock">Betöltés…</span><button onclick="location.href='../'">Klasszikus oldal ↗</button></div></div>
<header class="mast"><div class="shell"><a class="mark" href="./"><span>nap</span><i>híre</i><b>.ro</b></a><span class="edition">ERDÉLY + MAGYARORSZÁG<br>egy szerkesztett nézetben</span><button class="switch" onclick="location.href='../'">Vissza a klasszikusra</button></div></header>
<nav class="nav"><div class="shell"><div class="navlinks"><button class="active" onclick="scrollTo(0,0)">Címlap</button><button onclick="ugor('erdely')">Erdély</button><button onclick="ugor('magyar')">Magyarország</button><button onclick="ugor('gazdasag')">Gazdaság</button><button onclick="ugor('sport')">Sport</button><button onclick="ugor('kultura')">Kultúra</button></div><span class="navtag">Panoráma 01</span></div></nav>
<div class="ticker"><div class="shell"><strong>Most</strong><span id="ticker-text">Hírek összegyűjtése a partnerportálokról…</span></div></div>
<main><div class="shell" id="app"><div style="padding:60px 0;color:#77808e">Hírek betöltése…</div></div></main>
<footer><div class="footer-in"><span class="footer-logo">nap<i>híre</i>.ro</span><small>Panoráma nézet · a megjelölt portálok eredeti cikkeihez vezető szerkesztett áttekintés</small></div></footer>
<script>
const FORRASOK=[['Maszol','erdely','https://maszol.ro/rss'],['Székelyhon','erdely','https://szekelyhon.ro/rss/szekelyhon_hirek.xml'],['Transtelex','erdely','https://transtelex.ro/rss'],['Telex','magyar','https://telex.hu/rss'],['HVG','magyar','https://hvg.hu/rss'],['24.hu','magyar','https://24.hu/feed/'],['Index','magyar','https://index.hu/24ora/rss/'],['444','magyar','https://444.hu/feed']];
const app=document.getElementById('app');const esc=s=>(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function clean(s){const d=document.createElement('div');d.innerHTML=s||'';return (d.textContent||'').replace(/\s+/g,' ').trim()}
function imgFrom(item){const m=item.match(/<img[^>]+src=["']([^"']+)/i);return m?m[1]:''}
function parse(xml,name,region){const d=new DOMParser().parseFromString(xml,'text/xml');return [...d.querySelectorAll('item,entry')].slice(0,18).map(x=>{const title=clean(x.querySelector('title')?.textContent);let link=x.querySelector('link')?.textContent?.trim()||x.querySelector('link')?.getAttribute('href')||'#';const date=new Date(x.querySelector('pubDate,published,updated')?.textContent||Date.now());const desc=clean(x.querySelector('description,summary')?.textContent||'').slice(0,240);let img=x.querySelector('enclosure')?.getAttribute('url')||x.querySelector('media\\:content')?.getAttribute('url')||imgFrom(x.querySelector('description')?.textContent||'');return title?{title,link,date:isNaN(date)?new Date():date,desc,img,source:name,region}:null}).filter(Boolean)}
async function get(src){try{const r=await fetch('../rss?url='+encodeURIComponent(src[2]),{signal:AbortSignal.timeout(10000)});if(!r.ok)return[];return parse(await r.text(),src[0],src[1])}catch{return[]}}
function age(d){const m=Math.max(0,Math.floor((Date.now()-d)/60000));return m<60?m+' perce':Math.floor(m/60)+' órája'}
function meta(h){return '<span class="meta">'+esc(h.source)+'<i>—</i>'+age(h.date)+'</span>'}
function pic(h,cl=''){return '<div class="photo '+cl+'">'+(h.img?'<img src="'+esc(h.img)+'" alt="" loading="lazy">':'')+'</div>'}
function topic(items){const words=new Map();items.forEach(h=>clean(h.title.toLowerCase()).split(/[^a-záéíóöőúüű0-9]+/).filter(w=>w.length>5).forEach(w=>words.set(w,(words.get(w)||[]).concat(h))));let best=[...words.values()].sort((a,b)=>new Set(b.map(x=>x.source)).size-new Set(a.map(x=>x.source)).size)[0];return best&&new Set(best.map(x=>x.source)).size>=3?best.sort((a,b)=>b.date-a.date):null}
function zone(id,title,items,sub){if(!items.length)return '';const lead=items[0],list=items.slice(1,6);return '<section id="'+id+'" class="zone zone-'+id+'"><header class="zone-head"><span class="num">0'+({erdely:1,magyar:2,gazdasag:3,sport:4,kultura:5}[id]||1)+'</span><h2>'+title+'</h2><small>'+sub+'</small></header><div class="zone-body"><a class="zone-main" href="'+esc(lead.link)+'" target="_blank" rel="noopener">'+pic(lead)+ '<span class="label">'+esc(lead.source)+'</span><h3>'+esc(lead.title)+'</h3>'+meta(lead)+'</a><div class="zone-list">'+list.map(h=>'<a href="'+esc(h.link)+'" target="_blank" rel="noopener"><span><strong>'+esc(h.title)+'</strong>'+meta(h)+'</span></a>').join('')+'</div></div></section>'}
function render(items){items.sort((a,b)=>b.date-a.date);const hero=items[0],t=topic(items),by=id=>items.filter(h=>h.region==='erdely'&&id==='erdely'||h.region==='magyar'&&id==='magyar'||h.rovat===id);const focus=(t||items).slice(0,5);const counts={};items.forEach(h=>counts[h.source]=(counts[h.source]||0)+1);app.innerHTML='<section class="hero">'+ '<a class="hero-main" href="'+esc(hero.link)+'" target="_blank" rel="noopener">'+pic(hero,'hero-main')+'<span class="label">'+esc(hero.source)+' · kiemelt</span><h1>'+esc(hero.title)+'</h1><p>'+esc(hero.desc)+'</p>'+meta(hero)+'</a><aside class="focus"><h2><span>01 / szerkesztői nézet</span>Napi fókusz</h2>'+focus.map((h,i)=>'<a href="'+esc(h.link)+'" target="_blank" rel="noopener"><em>0'+(i+1)+'</em><span><strong>'+esc(h.title)+'</strong>'+meta(h)+'</span></a>').join('')+'</aside><aside class="sources"><h2>Forráskereszt</h2><p>'+Object.keys(counts).length+' portál hírei egy helyen.</p>'+Object.entries(counts).slice(0,8).map(([n,c],i)=>'<div class="source-row"><i class="s'+i%4+'"></i><b>'+esc(n)+'</b><em>'+c+' hír</em></div>').join('')+'</aside></section>'+(t?'<section class="topic"><div class="topic-head"><b>NAP TÉMÁJA</b><span>'+new Set(t.map(h=>h.source)).size+' forrásból</span></div><div class="topic-body"><a class="topic-lead" href="'+esc(t[0].link)+'" target="_blank" rel="noopener"><h2>'+esc(t[0].title)+'</h2><p>'+esc(t[0].desc)+'</p>'+meta(t[0])+'</a><div class="topic-side">'+t.slice(1,5).map(h=>'<a href="'+esc(h.link)+'" target="_blank" rel="noopener"><small>'+esc(h.source)+'</small><strong>'+esc(h.title)+'</strong></a>').join('')+'</div></div></section>':'')+'<div class="zones">'+zone('erdely','Erdély',by('erdely'),'helyi radar')+zone('magyar','Magyarország',by('magyar'),'országos ügyek')+zone('gazdasag','Gazdaság',items.filter(h=>/ár|pénz|gazdas|adó|cég|piac/i.test(h.title)),'piac / pénz / munka')+zone('sport','Sport',items.filter(h=>/sport|foci|meccs|bajnok|gól|csapat/i.test(h.title)),'eredmény / háttér')+zone('kultura','Kultúra',items.filter(h=>/kultúr|film|zene|színház|könyv|kiáll/i.test(h.title)),'színpad / kép / könyv')+'</div>'}
function ugor(id){document.getElementById(id)?.scrollIntoView({behavior:'smooth',block:'start'})}
document.getElementById('clock').textContent=new Date().toLocaleDateString('hu-HU',{year:'numeric',month:'long',day:'numeric'});
Promise.all(FORRASOK.map(get)).then(all=>{const items=all.flat();if(items.length){render(items);document.getElementById('ticker-text').textContent=items.slice(0,3).map(h=>h.title).join('  ·  ')}else app.innerHTML='<div style="padding:60px 0">A hírek átmenetileg nem érhetők el. Frissítsd az oldalt később.</div>'});
</script>
</body></html>
